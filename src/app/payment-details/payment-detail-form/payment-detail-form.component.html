<form #form="ngForm" (submit)="onSubmit(form)">
    <input type="hidden" name="paymentDetailId" [value]="service.formData.paymentDetailId">
    <div class="mb-3">
        <label for="cardOwnerName">Card Owner Name</label>
        <input id="cardOwnerName" class="form-control form-control-lg" 
        placeholder="Name of Card" name="cardOwnerName"
        #cardOwnerName="ngModel" [(ngModel)]="service.formData.cardOwnerName">
    </div>
    <div class="mb-3">
        <label for="cardNumber">Card Number</label>
        <input id="cardNumber" class="form-control form-control-lg" 
        placeholder="16 DigitCard Number" name="cardNumber"
        #cardNumber="ngModel" [(ngModel)]="service.formData.cardNumber">
    </div>
    <div class="row">
        <div class="mb-3 col-6">
            <label for="securityCode">Security Code</label>
            <input id="securityCode" class="form-control form-control-lg" 
            placeholder="CVV" type="password" name="securityCode"
            #securityCode="ngModel" [(ngModel)]="service.formData.securityCode">
        </div>
        <div class="mb-3 col-6">
            <label for="expirationDate">Valid Through</label>
            <input id="expirationDate" class="form-control form-control-lg" 
            placeholder="MM/YY" name="expirationDate"
            #expirationDate="ngModel" [(ngModel)]="service.formData.expirationDate">
        </div>
    </div>
    <div class="d-grid">
        <button class="btn btn-lg btn-success" type="submit">
            Submit
        </button>
    </div>
</form>
