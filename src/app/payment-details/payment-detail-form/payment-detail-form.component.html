<form>
    <input type="hidden" name="paymentDetailId" [value]="service.formData.paymentDetailId">
    <div class="mb-3">
        <label>Card Owner Name</label>
        <input class="form-control form-control-lg" 
        placeholder="Name on Card" name="cardOwnerName"
        [value]="service.formData.cardOwnerName" 
        (input)="service.formData.cardOwnerName = $event.target.value">
    </div>
    <div class="mb-3">
        <label>Card Number</label>
        <input class="form-control form-control-lg" 
        placeholder="16 DigitCard Number" name="cardNumber"
        [value]="service.formData.cardNumber" 
        (input)="service.formData.cardNumber = $event.target.value">
    </div>
    <div class="row">
        <div class="mb-3 col-6">
            <label>Security Code</label>
            <input class="form-control form-control-lg" 
            placeholder="CVV" type="password" name="securityCode"
            [value]="service.formData.securityCode" 
            (input)="service.formData.securityCode = $event.target.value">
        </div>
        <div class="mb-3 col-6">
            <label>Valid Through</label>
            <input class="form-control form-control-lg" 
            placeholder="MM/YY" name="expirationDate"
            [value]="service.formData.expirationDate" 
            (input)="service.formData.expirationDate = $event.target.value">
        </div>
    </div>
    <div class="d-grid">
        <button class="btn btn-lg btn-success" type="submit">
            Submit
        </button>
    </div>
</form>
